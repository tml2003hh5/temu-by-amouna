<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Temu by Amouna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="شعار Temu by Amouna" class="logo">
    <h1>Temu by Amouna</h1>
    <p>وسيطكِ لشراء منتجاتكِ المفضلة من متجر TEMU</p>
  </header>

  <main>
    <form>
      <div class="input-box">
        <label>الاسم:</label>
        <input type="text" name="firstname" required>
      </div>

      <div class="input-box">
        <label>اللقب:</label>
        <input type="text" name="lastname" required>
      </div>

      <div class="input-box">
        <label>رقم الهاتف:</label>
        <input type="tel" name="phone" required>
      </div>

      <div class="input-box">
        <label>العنوان الكامل:</label>
        <textarea name="address" required></textarea>
      </div>

      <div class="input-box">
        <label>صور المنتجات المراد شراؤها:</label>
        <div class="file-upload">
          <input type="file" id="product_images" name="product_images" multiple accept="image/*">
          <label for="product_images" class="custom-file-label">📷 اختر الصور</label>
        </div>
        <small>يمكنك رفع عدة صور</small>
      </div>

      <div class="input-box">
        <label>ملاحظات إضافية:</label>
        <textarea name="notes"></textarea>
      </div>

      <button type="submit">✨ إرسال الطلب ✨</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Temu by Amouna</p>
  </footer>
</body>
</html>
