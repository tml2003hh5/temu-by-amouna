<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Temu by Amouna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- النموذج مربوط بـ Formspree -->
    <form action="https://formspree.io/f/xeaqqbab" method="POST">
      <div class="form-header">
        <img src="logo.png" alt="شعار Temu by Amouna" class="logo">
        <h1>Temu by Amouna</h1>
        <p>وسيطكِ لشراء منتجاتكِ المفضلة من متجر TEMU</p>
      </div>

      <div class="input-box">
        <label>الاسم:</label>
        <input type="text" name="firstname" required>
      </div>

      <div class="input-box">
        <label>اللقب:</label>
        <input type="text" name="lastname" required>
      </div>

      <div class="input-box">
        <label>رقم الهاتف:</label>
        <input type="tel" name="phone" required>
      </div>

      <div class="input-box">
        <label>العنوان الكامل:</label>
        <textarea name="address" required></textarea>
      </div>

      <!-- حقل روابط المنتجات -->
      <div class="input-box">
        <label>رابط المنتج (يجب وضع رابط المنتج من TEMU):</label>
        <textarea name="product_link" placeholder="انسخ رابط المنتج من تطبيق TEMU هنا" required></textarea>
      </div>

      <div class="input-box">
        <label>ملاحظات إضافية:</label>
        <textarea name="notes"></textarea>
      </div>

      <div class="input-box">
        <label>بريدك الإلكتروني:</label>
        <input type="email" name="email" required>
      </div>

      <button type="submit">✨ إرسال الطلب ✨</button>

      <!-- روابط التواصل الاجتماعي -->
      <div class="social-links">
        <a href="https://www.instagram.com/temu.by.amouna?igsi=bWxxamI5OTAwdjNl" target="_blank">
          <img src="instagram-logo.png" alt="Instagram Logo" class="social-icon">
        </a>
        <a href="https://www.tiktok.com/@end_pirlo?_r=1&_t=ZS-99Gzu5Wo8qD" target="_blank">
          <img src="tiktok-logo.png" alt="TikTok Logo" class="social-icon">
        </a>
      </div>
    </form>
  </main>

  <footer>
    <p>© 2026 Temu by Amouna</p>
  </footer>
</body>
</html>
